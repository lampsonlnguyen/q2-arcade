name: Build and release q2-arcade

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc python3 zip unzip file
      - name: Test and build
        run: |
          make check
          make
      - name: Verify install package
        run: |
          unzip -t dist/q2-arcade.zip
          python3 tests/check_art.py dist/q2-arcade.zip
          unzip -p dist/q2-arcade.zip .arcade/q2app | grep -Fx 'game=1'
          test -s dist/.arcade/LICENSE.txt
          file dist/.arcade/q2-arcade | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-arcade-card-app
          path: dist/q2-arcade.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-arcade-card-app
          path: dist
      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-arcade.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-arcade.zip \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
